name: Build Mac, Windows, Linux

on:
  push:
    tags:
      - 'v*'
  # Manual trigger from the Actions UI for dry-runs (e.g., validating a new
  # build job before its first real release tag). Builds the binaries; the
  # `release` job below skips when the workflow isn't running off a tag, so
  # no GitHub release is created on a manual dispatch.
  workflow_dispatch:

jobs:
  lint:
    # Hard gate: pyflakes static-name check on every shipping Python file
    # (GUI, worker, modules). Blocks all four bundle builds on any
    # crash-class finding. Added after v1.97-beta shipped a one-line
    # `screen = QApplication.primaryScreen()` drop that pyflakes catches in
    # under a second. Intentionally minimal-deps so the gate runs in seconds.
    name: Pyflakes lint gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pyflakes
        run: pip install pyflakes
      - name: Run lint gate
        run: python3 tests/test_lint.py

  build-mac:
    needs: lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only PyTorch
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: |
          pip install pyinstaller 'numpy<2' pillow PySide6 ultralytics sahi nvidia-ml-py sentry-sdk tifffile scikit-image imageio imageio-ffmpeg pyobjc-core rawpy
          pip uninstall -y opencv-python opencv-python-headless opencv-contrib-python opencv-contrib-python-headless || true
          pip install 'opencv-contrib-python-headless==4.11.0.86'
          python -c "import numpy,cv2,sys; print('numpy',numpy.__version__,'cv2',cv2.__version__,'xphoto' if hasattr(cv2,'xphoto') else 'NO-XPHOTO'); sys.exit(0 if (hasattr(cv2,'xphoto') and numpy.__version__[0]=='1') else 1)"
      - name: Bake Sentry DSN
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          STC_COLLECT_SECRET: ${{ secrets.STC_COLLECT_SECRET }}
        run: |
          python -c "import os; open('_sentry_config.py','w').write('DSN = ' + repr(os.environ.get('SENTRY_DSN','')))"
          python -c "import os; open('_collect_config.py','w').write('SECRET = ' + repr(os.environ.get('STC_COLLECT_SECRET','')))"
      - name: Build (Apple Silicon)
        run: python build_helper.py
      - name: Smoke test bundled app
        # Runs the bundled worker on a synthetic frame. Catches bugs that
        # don't reproduce in dev: stripped torchvision MPS ops, missing
        # PyInstaller hidden imports, library version mismatches, etc.
        # If this fails, the bad bundle never reaches users.
        run: python scripts/smoke_built_bundle.py
      - name: Updater-alive gate
        # Launches the BUILT app with STC_UPDATER_SMOKE=1: it starts the
        # Sparkle engine and exits 0 only if the engine actually came alive
        # inside the frozen bundle. Five versions shipped with a dead engine
        # (init_sparkle crashed on a module PyInstaller didn't bundle; every
        # Mac user's auto-update silently never worked) because nothing in CI
        # ever STARTED the engine -- presence of Sparkle.framework was checked,
        # liveness never was. If this step fails, fix the engine; do not skip.
        run: STC_UPDATER_SMOKE=1 ./dist/StarTrailCleanR.app/Contents/MacOS/StarTrailCleanR
      - name: Build DMG
        # DMG instead of ZIP because macOS Gatekeeper triggers App
        # Translocation on .app bundles launched from a downloaded ZIP,
        # which silently disables Sparkle auto-updates and historically
        # crashed two confirmed users. Mounting a DMG and dragging the
        # .app to /Applications is the canonical macOS install flow and
        # avoids translocation entirely.
        #
        # The DMG window shows the app NEXT TO an Applications-folder
        # shortcut (the canonical drag-to-install layout). A bare lone icon
        # invites users to run the app straight off the DMG, where macOS
        # disables Sparkle updates -- which stranded a real user (2026-06-10,
        # on 2.45, reinstalling from the website every release). ditto, not
        # cp -R: cp corrupts code-signing seals and symlinks.
        run: |
          mkdir dmg_stage
          ditto dist/StarTrailCleanR.app dmg_stage/StarTrailCleanR.app
          ln -s /Applications dmg_stage/Applications
          cp "installers/open_me_first_mac.txt" "dmg_stage/Open Me First.txt"
          hdiutil create -volname "Star Trail CleanR" \
            -srcfolder dmg_stage \
            -ov -format UDZO \
            StarTrailCleanR-Mac-AppleSilicon.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: StarTrailCleanR-Mac
          path: StarTrailCleanR-Mac-AppleSilicon.dmg

  build-mac-intel:
    needs: lint
    # Intel Mac build on GitHub's x86_64 macOS runner.
    # GitHub has announced Intel Mac runners retire in Fall 2027. This job
    # runs through at least that point; after retirement we either drop
    # Intel Mac releases or move to a different host.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only PyTorch
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: |
          pip install pyinstaller 'numpy<2' pillow PySide6 ultralytics sahi nvidia-ml-py sentry-sdk tifffile scikit-image imageio imageio-ffmpeg pyobjc-core 'rawpy==0.25.1'
          pip uninstall -y opencv-python opencv-python-headless opencv-contrib-python opencv-contrib-python-headless || true
          pip install 'opencv-contrib-python-headless==4.11.0.86'
          python -c "import numpy,cv2,sys; print('numpy',numpy.__version__,'cv2',cv2.__version__,'xphoto' if hasattr(cv2,'xphoto') else 'NO-XPHOTO'); sys.exit(0 if (hasattr(cv2,'xphoto') and numpy.__version__[0]=='1') else 1)"
      - name: Bake Sentry DSN
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          STC_COLLECT_SECRET: ${{ secrets.STC_COLLECT_SECRET }}
        run: |
          python -c "import os; open('_sentry_config.py','w').write('DSN = ' + repr(os.environ.get('SENTRY_DSN','')))"
          python -c "import os; open('_collect_config.py','w').write('SECRET = ' + repr(os.environ.get('STC_COLLECT_SECRET','')))"
      - name: Build (Intel)
        run: python build_helper.py
      - name: Smoke test bundled app
        run: python scripts/smoke_built_bundle.py
      - name: Updater-alive gate
        # Same gate as the Apple Silicon job: the built app must prove its
        # Sparkle engine starts, or the build fails. See that job's comment.
        run: STC_UPDATER_SMOKE=1 ./dist/StarTrailCleanR.app/Contents/MacOS/StarTrailCleanR
      - name: Build DMG
        # Same drag-to-install layout as the Apple Silicon DMG: app icon next
        # to an Applications-folder shortcut, so users install it properly
        # instead of running it off the DMG (which kills Sparkle updates).
        run: |
          mkdir dmg_stage
          ditto dist/StarTrailCleanR.app dmg_stage/StarTrailCleanR.app
          ln -s /Applications dmg_stage/Applications
          cp "installers/open_me_first_mac.txt" "dmg_stage/Open Me First.txt"
          hdiutil create -volname "Star Trail CleanR" \
            -srcfolder dmg_stage \
            -ov -format UDZO \
            StarTrailCleanR-Mac-Intel.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: StarTrailCleanR-Mac-Intel
          path: StarTrailCleanR-Mac-Intel.dmg

  build-windows:
    needs: lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only PyTorch
        # PINNED. 2.11.0 is the newest torch with published cu128 Windows wheels,
        # which the in-app GPU installer downloads. Left unpinned, the build grabbed
        # whatever was newest (2.12.0) — and PyTorch shipped 2.12.0 for cu126 + cu130
        # but NOT cu128, so the GPU installer 404'd for every Windows NVIDIA user.
        # The GPU wheel gate below fails the build if these versions ever lose their
        # cu128 wheels, so this can't silently rot again. To move forward later,
        # bump to a version verified present on the cu128 index (and in
        # modules/gpu_pack.py _KNOWN_GOOD_CU128).
        run: pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: |
          pip install pyinstaller 'numpy<2' pillow PySide6 ultralytics sahi nvidia-ml-py sentry-sdk tifffile scikit-image imageio imageio-ffmpeg rawpy
          pip uninstall -y opencv-python opencv-python-headless opencv-contrib-python opencv-contrib-python-headless || true
          pip install 'opencv-contrib-python-headless==4.11.0.86'
          python -c "import numpy,cv2,sys; print('numpy',numpy.__version__,'cv2',cv2.__version__,'xphoto' if hasattr(cv2,'xphoto') else 'NO-XPHOTO'); sys.exit(0 if (hasattr(cv2,'xphoto') and numpy.__version__[0]=='1') else 1)"
      - name: GPU wheel gate
        # Prove the in-app GPU installer's download links actually resolve for the
        # torch version this build ships, using the app's own URL builder so it
        # tests exactly what users will request. Fails the build on a dead link.
        run: python scripts/check_gpu_wheels.py
      - name: Bake Sentry DSN
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          STC_COLLECT_SECRET: ${{ secrets.STC_COLLECT_SECRET }}
        run: |
          python -c "import os; open('_sentry_config.py','w').write('DSN = ' + repr(os.environ.get('SENTRY_DSN','')))"
          python -c "import os; open('_collect_config.py','w').write('SECRET = ' + repr(os.environ.get('STC_COLLECT_SECRET','')))"
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
        shell: pwsh
      - name: Build (PyInstaller)
        run: python build_helper.py
      - name: Smoke test bundled app
        run: python scripts/smoke_built_bundle.py
        shell: pwsh
      - name: Updater-alive gate
        # Windows edition of the Mac gate: the BUILT app must prove its
        # WinSparkle engine loads (STC_UPDATER_SMOKE=1 makes it exit 0 only
        # when the DLL came alive), or the build fails. GUI exes detach from
        # the console, so Start-Process -Wait is required to read the real
        # exit code. Added after the Mac engine shipped dead for 50 versions
        # because nothing in CI ever started it.
        run: |
          $env:STC_UPDATER_SMOKE = "1"
          $p = Start-Process -FilePath "dist\StarTrailCleanR\StarTrailCleanR.exe" -Wait -PassThru
          Write-Host "updater smoke exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
        shell: pwsh
      - name: Updater live-check gate
        # The gate above proves the engine LOADS. This one proves a check
        # SUCCEEDS: the built app performs a real update check against the
        # live feed and the build FAILS if the engine reports an error.
        #
        # Blocking on purpose. The Windows updater was broken for every user
        # from 2026-05-01 to 2026-07-27 (a wide string passed to the engine's
        # narrow-string URL setter, so it fetched the URL "h") and nothing in
        # CI could see it -- "engine loads" passed the whole time, testers'
        # reports were blamed on their security software. This gate ran first
        # as report-only, caught exactly that failure on a clean machine, and
        # became blocking the moment the fix landed. If it fails, the updater
        # is broken for real users: fix the cause, never skip the gate.
        run: |
          $env:STC_UPDATER_CHECK = "1"
          $p = Start-Process -FilePath "dist\StarTrailCleanR\StarTrailCleanR.exe" -Wait -PassThru
          Write-Host "updater live-check exit code: $($p.ExitCode)"
          switch ($p.ExitCode) {
            0 { Write-Host "RESULT: the update check succeeded on a clean Windows machine." }
            1 { Write-Host "RESULT: the engine could not start a check at all." }
            2 { Write-Host "RESULT: the engine failed to retrieve update information." }
            3 { Write-Host "RESULT: the check never came back within 90 seconds." }
            default { Write-Host "RESULT: unexpected exit code." }
          }
          if ($p.ExitCode -ne 0) { exit 1 }
        shell: pwsh
      - name: Read version
        id: version
        run: echo "version=$(Get-Content version.txt)" >> $env:GITHUB_OUTPUT
        shell: pwsh
      - name: Build installer (Inno Setup)
        run: iscc /DAppVersion=${{ steps.version.outputs.version }} installer\StarTrailCleanR.iss
        shell: pwsh
      - name: Wrap installer in zip
        # Edge SmartScreen quarantines unsigned .exe downloads in a "Microsoft
        # Defender SmartScreen couldn't verify..." dialog whose "Keep" option
        # is buried in a near-invisible dropdown next to the Delete button.
        # Wrapping the installer in a zip sidesteps that gate. NoCompression
        # because the .exe is already LZMA2-compressed; Deflate would just burn CI time.
        run: |
          Copy-Item "installers\open_me_first_windows.txt" "installer\Open Me First.txt"
          Compress-Archive -Path installer\StarTrailCleanRSetup.exe, "installer\Open Me First.txt" -DestinationPath installer\StarTrailCleanRSetup.zip -CompressionLevel NoCompression
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: StarTrailCleanR-Windows
          path: installer/StarTrailCleanRSetup.zip

  build-linux:
    needs: lint
    # Ubuntu 22.04 (glibc 2.35) instead of ubuntu-latest so the binary runs
    # on Ubuntu 22.04+, Debian 12+, Fedora 36+, and other 2022-or-newer
    # distros. ubuntu-latest currently pins to 24.04 (glibc 2.39) which would
    # shut out users still on older LTS releases.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Qt system libraries
        # PySide6 wheels include Qt's own .so files but Qt loads a handful of
        # standard X11/Wayland system libraries at runtime. Ubuntu's minimal
        # CI image doesn't include them by default. Without these the bundle
        # builds fine but the frozen app crashes on launch with
        # "Could not load the Qt platform plugin 'xcb'".
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 libegl1 \
            libfontconfig1 libdbus-1-3
      - name: Install CPU-only PyTorch
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: |
          pip install pyinstaller 'numpy<2' pillow PySide6 ultralytics sahi nvidia-ml-py sentry-sdk tifffile scikit-image imageio imageio-ffmpeg rawpy
          pip uninstall -y opencv-python opencv-python-headless opencv-contrib-python opencv-contrib-python-headless || true
          pip install 'opencv-contrib-python-headless==4.11.0.86'
          python -c "import numpy,cv2,sys; print('numpy',numpy.__version__,'cv2',cv2.__version__,'xphoto' if hasattr(cv2,'xphoto') else 'NO-XPHOTO'); sys.exit(0 if (hasattr(cv2,'xphoto') and numpy.__version__[0]=='1') else 1)"
      - name: Bake Sentry DSN
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          STC_COLLECT_SECRET: ${{ secrets.STC_COLLECT_SECRET }}
        run: |
          python -c "import os; open('_sentry_config.py','w').write('DSN = ' + repr(os.environ.get('SENTRY_DSN','')))"
          python -c "import os; open('_collect_config.py','w').write('SECRET = ' + repr(os.environ.get('STC_COLLECT_SECRET','')))"
      - name: Build (PyInstaller)
        run: python build_helper.py
      - name: Smoke test bundled app
        run: python scripts/smoke_built_bundle.py
      - name: Tar bundle
        # tar.gz keeps Unix file permissions (the binary's exec bit). zip
        # would strip them and the user would get "permission denied" trying
        # to launch the binary. .tar.gz is the Linux norm anyway.
        run: cd dist && tar -czf ../StarTrailCleanR-Linux-x86_64.tar.gz StarTrailCleanR
      - uses: actions/upload-artifact@v4
        with:
          name: StarTrailCleanR-Linux
          path: StarTrailCleanR-Linux-x86_64.tar.gz

  # build-windows-nvidia removed 2026-04-23 in the v1.5-beta re-ship.
  # The CUDA-enabled installer came out 3.13 GB, over GitHub's 2 GB per-file
  # release asset cap. Parked as todo #1 pending a size fix (strip more CUDA
  # libraries with a Windows NVIDIA tester, host externally, or switch to
  # torch-directml). When re-adding this job, also restore its tests in
  # tests/test_installer_config.py and its URL in reference_stable_download_urls.md.

  release:
    needs: [build-mac, build-mac-intel, build-windows, build-linux]
    runs-on: ubuntu-latest
    # Skip the release-creation step on manual dry-runs. Only fires when the
    # workflow was triggered by a `v*` tag push.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            StarTrailCleanR-Mac/StarTrailCleanR-Mac-AppleSilicon.dmg
            StarTrailCleanR-Mac-Intel/StarTrailCleanR-Mac-Intel.dmg
            StarTrailCleanR-Windows/StarTrailCleanRSetup.zip
            StarTrailCleanR-Linux/StarTrailCleanR-Linux-x86_64.tar.gz
          body: |
            ## Star Trail CleanR ${{ github.ref_name }}

            ### Download

            **Mac**
            - **Apple Silicon (M1/M2/M3/M4)**: StarTrailCleanR-Mac-AppleSilicon.dmg, double-click to mount, then drag StarTrailCleanR into your Applications folder. The first time you open it, macOS shows a security warning because the app is not yet notarized. To open it: click Done, then go to System Settings, then Privacy & Security, scroll down, and click "Open Anyway". The disk image includes an "Open Me First.txt" with these exact steps.
            - **Intel (older Macs)**: StarTrailCleanR-Mac-Intel.dmg, same steps. Slower than Apple Silicon (no built-in GPU acceleration) but functional.

            **Windows**
            - **Standard**: StarTrailCleanRSetup.zip. Right-click the downloaded zip and choose "Extract All...", then double-click StarTrailCleanRSetup.exe inside the extracted folder.
            - **If Windows shows a blue "Windows protected your PC" screen:** click "More info" then "Run anyway". One-time step.
            - **If you see "Error 4551: An application control policy has blocked this file":** right-click the installer and choose "Run as administrator". If that still fails, your machine has IT-managed security settings that block unsigned apps; contact your IT department or try on a personal machine.

            **Linux** (x86_64, Ubuntu 22.04+ / Debian 12+ / Fedora 36+ or newer)
            - StarTrailCleanR-Linux-x86_64.tar.gz. Extract anywhere (`tar -xzf StarTrailCleanR-Linux-x86_64.tar.gz`), then run `./StarTrailCleanR/StarTrailCleanR` from the extracted folder. First Linux release; please report any issues.

  publish-appcast:
    # Auto-publish the Sparkle/WinSparkle auto-update feeds after the release
    # is cut. THIS is the step that actually reaches already-installed apps.
    # It used to be a manual local command (scripts/release_signer.py) that got
    # skipped after v2.04-beta, silently freezing every auto-update user 43
    # versions behind while the website download kept advancing. Now it runs
    # automatically on a macOS runner (needed for the vendored sign_update
    # tool), signs each installer with the SPARKLE_ED_PRIVATE_KEY secret,
    # prepends the new version to all three appcasts on gh-pages, and then
    # HARD-FAILS the build if the live feeds don't advertise the new version.
    # "Build green" now means "users will actually get this update."
    needs: [release]
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download built installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Check out gh-pages feed branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-pub
      - name: Write signing key from secret
        # The ed25519 key is a GitHub encrypted secret; it is masked in logs
        # and written to a runner-temp file that is destroyed with the runner.
        env:
          KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          printf '%s' "$KEY" > "$RUNNER_TEMP/sparkle_key"
          chmod 600 "$RUNNER_TEMP/sparkle_key"
      - name: Sign installers and update feeds
        run: |
          chmod +x vendored/sparkle-bin/sign_update
          python3 scripts/publish_appcast.py "${GITHUB_REF_NAME}" \
            --artifacts-dir artifacts \
            --key-file "$RUNNER_TEMP/sparkle_key" \
            --gh-pages-dir gh-pages-pub
      - name: Commit and push updated feeds
        run: |
          cd gh-pages-pub
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Feeds already current — nothing to publish."
          else
            git commit -m "Publish ${GITHUB_REF_NAME} to auto-update feeds"
            git push origin gh-pages
          fi
      - name: Verify feeds are live (hard gate)
        # Polls all three live feeds; fails the build if any does not advertise
        # the new version within the timeout. This is the alarm that makes a
        # skipped or partial publish impossible to miss.
        run: python3 scripts/publish_appcast.py "${GITHUB_REF_NAME}" --verify

  sync-changelog:
    # Keep CHANGELOG.md on `main` current. Releases are tagged from a long-lived
    # working branch, NOT main, so main's CHANGELOG used to freeze: it sat at
    # v1.995-beta while the app shipped v2.56, and the in-app "version history on
    # GitHub" link (About tab -> blob/main/CHANGELOG.md) showed a stale history.
    # This copies the tagged CHANGELOG.md onto main automatically so that link is
    # always current. Doc-only: it touches CHANGELOG.md on main and nothing else.
    # It runs in PARALLEL with publish-appcast (both only need `release`), so a
    # failure here can never block the release or the auto-update publish that
    # actually reaches users.
    needs: [release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          path: tagged
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-co
      - name: Copy the tagged CHANGELOG.md onto main and push if changed
        run: |
          cp tagged/CHANGELOG.md main-co/CHANGELOG.md
          cd main-co
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "CHANGELOG.md on main already current — nothing to sync."
          else
            git commit -m "Sync CHANGELOG.md to main for ${GITHUB_REF_NAME}"
            git push origin main
          fi

  mirror-installers:
    # Copies the four installers to our own DreamHost mirror
    # (https://api.startrailcleanr.com/downloads/). CRITICAL PATH since v2.80:
    # the app's update engine reads its feed from api.startrailcleanr.com and
    # that feed's download links point at these mirror copies, so this job
    # HARD-FAILS on a missing secret or missing installer. (It also still
    # serves website/latest.php's GitHub-blocked download fallback.)
    needs: [build-mac, build-mac-intel, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install paramiko
        run: pip install paramiko
      - name: Download built installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Upload installers to the DreamHost failsafe mirror
        env:
          DREAMHOST_PASSWORD: ${{ secrets.DREAMHOST_PASSWORD }}
        run: python3 scripts/mirror_upload.py artifacts

  publish-appcast-mirror:
    # The feeds the app actually reads from v2.80 on. Takes the newest item
    # from each just-verified GitHub Pages feed, repoints its download link at
    # the mirror installer copy (same bytes, same signature), uploads the
    # single-item feeds to api.startrailcleanr.com, and HARD-FAILS unless the
    # live mirror feeds advertise this release AND each mirror installer's
    # size matches what the feed promises. Runs after BOTH the gh-pages
    # publish (source of the signed item) and the mirror upload (source of
    # the binaries) so it can never advertise files that aren't there.
    needs: [publish-appcast, mirror-installers]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install paramiko
        run: pip install paramiko
      - name: Publish and verify the mirror feeds
        env:
          DREAMHOST_PASSWORD: ${{ secrets.DREAMHOST_PASSWORD }}
        run: python3 scripts/publish_appcast.py "${GITHUB_REF_NAME}" --publish-mirror
